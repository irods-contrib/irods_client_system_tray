
name: "Run pytest"

on: [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-24.04

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          libdbus-1-3 \
          libegl1 \
          libgl1 \
          libglib2.0-0 \
          libxkbcommon0 \
          libxcb-cursor0 \
          libxkbcommon-x11-0 \
          libxcb-icccm4 \
          libxcb-image0 \
          libxcb-keysyms1 \
          libxcb-randr0 \
          libxcb-render-util0 \
          libxcb-shape0 \
          libxcb-xfixes0 \
          libxcb-xinerama0
        pip install ./
    - name: Run pytest tests
      run: |
        python -m pytest tests/
